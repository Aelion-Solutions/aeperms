name: Publish aeperm-api

# On-demand release publish of sh.aelion:aeperm-api to https://maven.aelion.solutions/
# SNAPSHOT publishes run from CI on every push to main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (empty = gradle.properties)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            bash ./gradlew :api:publish --no-daemon --no-configuration-cache -Pversion="$VERSION_OVERRIDE"
          else
            bash ./gradlew :api:publish --no-daemon --no-configuration-cache
          fi
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_TOKEN: ${{ secrets.MVN_TOKEN }}
