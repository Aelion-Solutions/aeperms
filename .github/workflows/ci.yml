name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
      - "v*.*"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          BASE=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            VERSION="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          else
            VERSION="${BASE}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved version ${VERSION}"

      - name: Test and build plugin jars
        run: |
          set -euo pipefail
          bash ./gradlew test jacocoTestCoverageVerification \
            :paper:shadowJar :velocity:shadowJar :bungee:shadowJar \
            --no-daemon --no-configuration-cache -Pversion="${VERSION}"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Stage plugin jars
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "paper/build/libs/aeperm-paper-${VERSION}.jar" dist/
          cp "velocity/build/libs/aeperm-velocity-${VERSION}.jar" dist/
          cp "bungee/build/libs/aeperm-bungee-${VERSION}.jar" dist/
          ls -l dist
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: aeperm-jars
          path: dist/
          if-no-files-found: error

  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish aeperm-api snapshot
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          case "$VERSION" in
            *-SNAPSHOT) ;;
            *) VERSION="${VERSION}-SNAPSHOT" ;;
          esac
          bash ./gradlew :api:publish --no-daemon --no-configuration-cache -Pversion="$VERSION"
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_TOKEN: ${{ secrets.MVN_TOKEN }}

  github-release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download plugin jars
        uses: actions/download-artifact@v4
        with:
          name: aeperm-jars
          path: dist

      - name: Point floating dev tag at this commit
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/tags/dev"
          code=$(curl -sS -o /tmp/dev-tag.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${url}")
          if [ "${code}" = "200" ]; then
            curl -sS -X PATCH "${url}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"sha\":\"${GITHUB_SHA}\",\"force\":true}" >/dev/null
          fi

      - name: Publish GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Development {0}', needs.build.outputs.version) }}
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          makeLatest: ${{ github.ref_type == 'tag' }}
          generateReleaseNotes: ${{ github.ref_type == 'tag' }}
          artifactErrorsFailBuild: true
          artifacts: dist/aeperm-paper-*.jar,dist/aeperm-velocity-*.jar,dist/aeperm-bungee-*.jar
          body: ${{ github.ref == 'refs/heads/main' && format('Development build from `main` ({0}).', github.sha) || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}
