name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: bash ./gradlew test jacocoTestCoverageVerification --no-daemon --no-configuration-cache

  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, aelion]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish aeperm-api snapshot
        run: |
          VERSION=$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')
          case "$VERSION" in
            *-SNAPSHOT) ;;
            *) VERSION="${VERSION}-SNAPSHOT" ;;
          esac
          bash ./gradlew :api:publish --no-daemon --no-configuration-cache -Pversion="$VERSION"
        env:
          MVN_USER: ${{ secrets.MVN_USER }}
          MVN_TOKEN: ${{ secrets.MVN_TOKEN }}
